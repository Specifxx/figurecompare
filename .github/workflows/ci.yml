name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build against the fixture (every page prerenders)
        env:
          FIGURE_DATA_DIR: tests/fixtures/data
          NEXT_TELEMETRY_DISABLED: 1
        run: npx next build

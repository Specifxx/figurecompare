name: First import (temporary, removed before merge)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/first-import-tmp.yml", "src/content/stores.ts", "src/lib/import/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: first-import
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/import.ts
      - name: Commit data to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: first import $(date -u +%F)"
          git push origin HEAD:${GITHUB_REF_NAME}
